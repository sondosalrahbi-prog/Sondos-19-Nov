<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="split">
  <aside class="split-visual">
    <div class="visual-text">
      <h2>Build something people love</h2>
      <p>Join 40,000 designers and developers who ship faster with Craftly.</p>
    </div>
  </aside>

  <main class="split-form">
    <form class="form card" action="#">
      <h1>Create your account</h1>
      <p class="muted">It takes less than a minute.</p>

      <div class="row">
        <div class="field">
          <label for="first">First name</label>
          <input id="first" type="text" placeholder="Amira">
        </div>
        <div class="field">
          <label for="last">Last name</label>
          <input id="last" type="text" placeholder="Hassan">
        </div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="amira@example.com">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="At least 8 characters">
      </div>

      <div class="row row--between">
        <label class="check"><input type="checkbox"> Remember me</label>
        <a class="link" href="#">Forgot password?</a>
      </div>

      <button class="btn submit" type="submit">Sign up</button>
      <p class="alt muted">Already have an account? <a class="link" href="#">Log in</a></p>
    </form>
  </main>
</div>
</body>
</html>
