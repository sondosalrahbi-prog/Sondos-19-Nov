<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wanderly — Hero</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <section class="hero">
    <div class="container hero-inner">
      <div class="hero-text">
        <p class="eyebrow">New · Spring 2026</p>
        <h1>Plan your next trip in minutes</h1>
        <p class="lead">Wanderly turns a messy pile of bookmarks into a day-by-day itinerary you can share with friends.</p>
        <div class="hero-actions">
          <a class="btn" href="#">Get started</a>
          <a class="btn btn--ghost" href="#">Watch demo</a>
        </div>
        <ul class="hero-stats">
          <li><strong>12k+</strong><span>travellers</span></li>
          <li><strong>140</strong><span>countries</span></li>
          <li><strong>4.9</strong><span>app rating</span></li>
        </ul>
      </div>
      <img class="hero-img" src="images/hero.svg" width="800" height="600" alt="">
    </div>
  </section>
</main>
</body>
</html>
