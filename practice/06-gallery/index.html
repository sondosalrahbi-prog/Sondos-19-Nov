<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="container page-head">
  <h1>Weekend in pictures</h1>
  <p class="muted">Ten photos from a very long Saturday.</p>
</header>

<main class="container">
  <ul class="gallery">
    <li class="shot shot--big"><img src="images/g1.svg" width="800" height="600" alt="Sunrise"></li>
    <li class="shot"><img src="images/g2.svg" width="800" height="600" alt="Forest"></li>
    <li class="shot"><img src="images/g3.svg" width="800" height="600" alt="Lake"></li>
    <li class="shot shot--wide"><img src="images/g4.svg" width="800" height="600" alt="Canyon"></li>
    <li class="shot"><img src="images/g5.svg" width="800" height="600" alt="Coast"></li>
    <li class="shot shot--tall"><img src="images/g6.svg" width="800" height="600" alt="Tower"></li>
    <li class="shot"><img src="images/g7.svg" width="800" height="600" alt="Market"></li>
    <li class="shot"><img src="images/g8.svg" width="800" height="600" alt="Bridge"></li>
    <li class="shot shot--wide"><img src="images/g9.svg" width="800" height="600" alt="Harbour"></li>
    <li class="shot"><img src="images/g10.svg" width="800" height="600" alt="Cabin"></li>
  </ul>
</main>
</body>
</html>
